
name: Fetch GitHub Pages Visitor Stats

on:
  schedule:
    - cron: '0 6 * * *'  # Runs daily at 06:00 UTC
  workflow_dispatch:        # Allows manual trigger for testing

jobs:
  fetch-stats:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Fetch visitor stats
        env:
          TRAFFIC_PAT: ${{ secrets.TRAFFIC_PAT }}
        run: python scripts/fetch_traffic.py

      - name: Commit and push updated stats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --staged --quiet || git commit -m "Update visit stats - $(date +%Y-%m-%d)"
          git push

